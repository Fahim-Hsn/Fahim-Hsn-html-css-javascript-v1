<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Search</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(#89f7fe, #66a6ff);
    text-align: center;
  }

  .text {
    margin-top: 50px;
    font-size: 36px;
    color: #fff;
  }

  .search-container {
    margin-top: 20px;
  }

  .search-box {
    width: 250px;
    padding: 12px 20px;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    outline: none;
    background: white url('https://img.icons8.com/ios-filled/20/0077ff/search--v1.png') no-repeat 15px center;
    padding-left: 45px; 
    box-shadow: 0 4px 15px black;
  }

  .search-button {
    padding: 12px 20px;
    margin-left: 10px;
    font-size: 16px;
    border: none;
    border-radius: 50px;
    background-color: #0077ff;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 10px black;
  }

  #foods {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 40px;
  }

  .food-card {
    width: 200px;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    text-align: center;
    background: #fff;
  }

  .food-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
  }

  .food-card p {
    margin: 10px 0;
    font-weight: bold;
    color: #333;
  }

  .no-food {
    color: #fff;
    font-size: 24px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="text">Get food list by Country</div>

<div class="search-container">
  <input type="text" class="search-box" placeholder="Enter country name">
  <button class="search-button">Search</button>
</div>

<div id="foods"></div>

<script src="main.js"></script>
</body>
</html>
